<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Máy In Tiền AFK</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1015; color: #ffffff; text-align: center;
    }
    .box {
      background: #1b1d28; border-radius: 16px; padding: 20px; margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #2a2d3e;
    }
    .user-tag {
      background: #2a2d3e; display: inline-block; padding: 6px 14px;
      border-radius: 20px; font-size: 13px; color: #00ff88; margin-bottom: 15px;
    }
    .balance-title { font-size: 14px; color: #8c93a8; text-transform: uppercase; letter-spacing: 1px; }
    .balance-val { font-size: 34px; font-weight: 800; color: #00ff88; margin: 10px 0; }
    .timer-val { font-size: 24px; font-weight: bold; color: #ffb703; margin: 5px 0; }
    .status-running { color: #00ff88; font-weight: bold; }
    .status-stopped { color: #ff4757; font-weight: bold; }
    .btn-charge {
      background: linear-gradient(135deg, #ff9900, #ff5500); color: #fff; border: none;
      padding: 16px 24px; font-size: 18px; font-weight: bold; border-radius: 35px;
      width: 100%; cursor: pointer; box-shadow: 0 4px 15px rgba(255,102,0,0.4);
    }
    .btn-charge:active { transform: scale(0.96); }
    .note { font-size: 13px; color: #8c93a8; margin-top: 15px; }

    /* Form Đăng ký */
    #register-screen { display: none; }
    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 13px; color: #8c93a8; margin-bottom: 5px; }
    .input-field {
      width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px;
      background: #12131a; border: 1px solid #2a2d3e; color: #fff; font-size: 16px;
    }
    .input-field:focus { outline: none; border-color: #00ff88; }
    .btn-register {
      background: linear-gradient(135deg, #00ff88, #00b894); color: #000; border: none;
      padding: 16px; font-size: 18px; font-weight: bold; border-radius: 35px;
      width: 100%; cursor: pointer; margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH ĐĂNG KÝ TÀI KHOẢN (Hiện khi người chơi mới vào) -->
  <div id="register-screen">
    <h2>📝 TẠO TÀI KHOẢN MỚI</h2>
    <p style="color: #8c93a8; font-size: 14px;">Vui lòng tạo tài khoản để lưu trữ dữ liệu và số dư của bạn.</p>

    <div class="box">
      <div class="input-group">
        <label>Tên nhân vật / Tên tài khoản:</label>
        <input type="text" id="reg-username" class="input-field" placeholder="Ví dụ: DaiGia_2026">
      </div>
      <div class="input-group">
        <label>Mã PIN bảo mật rút tiền (4-6 số):</label>
        <input type="password" id="reg-pin" class="input-field" placeholder="Nhập mã PIN bí mật">
      </div>
      <button class="btn-register" onclick="handleRegister()">XÁC NHẬN TẠO TÀI KHOẢN</button>
    </div>
  </div>

  <!-- MÀN HÌNH GAME CHÍNH (Hiện sau khi đã đăng ký) -->
  <div id="game-screen" style="display: none;">
    <div id="user-display" class="user-tag">👤 Tài khoản: Đang tải...</div>

    <h2>⚡ MÁY IN TIỀN TỰ ĐỘNG</h2>

    <div class="box">
      <div class="balance-title">Số Dư Tích Lũy</div>
      <div id="balance" class="balance-val">$0.000000</div>
      <div style="font-size: 12px; color: #8c93a8;">Tốc độ: +$0.0000003 / giây</div>
    </div>

    <div class="box">
      <div class="balance-title">Nhiên Liệu Hoạt Động</div>
      <div id="timer" class="timer-val">00h 00m 00s</div>
      <div id="status" class="status-stopped">Trạng thái: ĐÃ DỪNG</div>
    </div>

    <button class="btn-charge" onclick="chargeFuel()">⚡ NẠP +10 PHÚT (XEM QUẢNG CÁO)</button>
    <div class="note">Nạp dồn không giới hạn. Hết giờ máy sẽ ngừng in tiền!</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let balance = 0;
    let fuelExpiresAt = 0;
    let ratePerSec = 0.0000003;

    // 1. Kiểm tra trạng thái tài khoản
    async function loadData() {
      try {
        const res = await fetch('/api/user-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        const data = await res.json();

        if (data.success) {
          if (!data.is_registered) {
            // Chưa đăng ký -> Hiện màn hình đăng ký
            document.getElementById('register-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
          } else {
            // Đã có tài khoản -> Vào thẳng game
            document.getElementById('register-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('user-display').innerText = `👤 Tài khoản: ${data.username}`;
            balance = data.balance;
            fuelExpiresAt = data.fuel_expires_at;
            ratePerSec = data.rate_per_sec;
          }
        }
      } catch (err) {
        console.error(err);
      }
    }

    // 2. Xử lý bấm Đăng ký tài khoản
    async function handleRegister() {
      const username = document.getElementById('reg-username').value;
      const pin = document.getElementById('reg-pin').value;

      if (!username || !pin) {
        alert("Vui lòng nhập đầy đủ Tên tài khoản và Mã PIN!");
        return;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg.initData,
            username: username,
            pin: pin
          })
        });
        const data = await res.json();

        if (data.success) {
          alert("🎉 Chúc mừng! Bạn đã tạo tài khoản thành công!");
          loadData(); // Tự động load vào game
        } else {
          alert(data.error || "Đăng ký thất bại!");
        }
      } catch (e) {
        alert("Lỗi kết nối máy chủ!");
      }
    }

    // 3. Chạy đếm ngược và tăng tiền mượt mà
    setInterval(() => {
      const now = Math.floor(Date.now() / 1000);
      const remaining = Math.max(0, fuelExpiresAt - now);

      if (remaining > 0) {
        balance += ratePerSec;
        const h = String(Math.floor(remaining / 3600)).padStart(2, '0');
        const m = String(Math.floor((remaining % 3600) / 60)).padStart(2, '0');
        const s = String(remaining % 60).padStart(2, '0');

        document.getElementById('timer').innerText = `${h}h ${m}m ${s}s`;
        document.getElementById('status').innerText = 'Trạng thái: ĐANG IN TIỀN';
        document.getElementById('status').className = 'status-running';
      } else {
        document.getElementById('timer').innerText = '00h 00m 00s';
        document.getElementById('status').innerText = 'Trạng thái: HẾT NHIÊN LIỆU (ĐÃ DỪNG)';
        document.getElementById('status').className = 'status-stopped';
      }
      document.getElementById('balance').innerText = `$${balance.toFixed(6)}`;
    }, 1000);

    // 4. Bấm nạp nhiên liệu (Xem Monetag)
    async function chargeFuel() {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      try {
        const res = await fetch('/api/create-ad-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        const data = await res.json();

        if (data.success && data.adUrl) {
          tg.openLink(data.adUrl);
          setTimeout(loadData, 15000);
        }
      } catch (e) {
        alert("Không thể tải quảng cáo lúc này!");
      }
    }

    loadData();
  </script>
</body>
</html>
